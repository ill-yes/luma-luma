name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Test release publication
        run: python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Run tests
        run: ./scripts/test-hdr.sh
      - name: Build and verify disk image
        id: package
        env:
          ARCHITECTURE: ${{ matrix.arch }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          stem="LumaLuma-ci-${GITHUB_SHA:0:7}-macos-$ARCHITECTURE"
          ./scripts/package-release.sh "$version" "$GITHUB_RUN_NUMBER" "$ARCHITECTURE" "$stem"
          printf 'filename=%s.dmg\n' "$stem" >> "$GITHUB_OUTPUT"
      - name: Upload disk image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.filename }}
          path: dist/${{ steps.package.outputs.filename }}
          archive: false
          overwrite: true
          if-no-files-found: error
      - name: Upload disk image checksum
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.filename }}.sha256
          path: dist/${{ steps.package.outputs.filename }}.sha256
          archive: false
          overwrite: true
          if-no-files-found: error
