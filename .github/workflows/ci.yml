name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    uses: ./.github/workflows/build-dmg.yml
    with:
      architecture: ${{ matrix.architecture }}
      upload_artifacts: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
