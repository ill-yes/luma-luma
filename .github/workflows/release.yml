name: Release LumaLuma
run-name: "Release LumaLuma #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumaluma-release
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      published: ${{ steps.prepare.outputs.published }}
      artifact_ids: >-
        ${{ steps.arm64_image.outputs.artifact-id }},
        ${{ steps.arm64_checksum.outputs.artifact-id }},
        ${{ steps.x86_64_image.outputs.artifact-id }},
        ${{ steps.x86_64_checksum.outputs.artifact-id }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release version and retry state
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py prepare
      - name: Show toolchain
        if: steps.prepare.outputs.published != 'true'
        run: swift --version
      - name: Test release publication
        if: steps.prepare.outputs.published != 'true'
        run: python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Test display behavior
        if: steps.prepare.outputs.published != 'true'
        run: ./scripts/test-hdr.sh
      - name: Build and verify disk images
        if: steps.prepare.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ steps.prepare.outputs.build_number }}
        run: |
          ./scripts/package-release.sh "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER" arm64
          ./scripts/package-release.sh "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER" x86_64
      - name: Upload Apple Silicon disk image
        id: arm64_image
        if: steps.prepare.outputs.published != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LumaLuma-${{ steps.prepare.outputs.version }}-macos-arm64.dmg
          path: dist/LumaLuma-${{ steps.prepare.outputs.version }}-macos-arm64.dmg
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Apple Silicon checksum
        id: arm64_checksum
        if: steps.prepare.outputs.published != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LumaLuma-${{ steps.prepare.outputs.version }}-macos-arm64.dmg.sha256
          path: dist/LumaLuma-${{ steps.prepare.outputs.version }}-macos-arm64.dmg.sha256
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Intel disk image
        id: x86_64_image
        if: steps.prepare.outputs.published != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LumaLuma-${{ steps.prepare.outputs.version }}-macos-x86_64.dmg
          path: dist/LumaLuma-${{ steps.prepare.outputs.version }}-macos-x86_64.dmg
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload Intel checksum
        id: x86_64_checksum
        if: steps.prepare.outputs.published != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LumaLuma-${{ steps.prepare.outputs.version }}-macos-x86_64.dmg.sha256
          path: dist/LumaLuma-${{ steps.prepare.outputs.version }}-macos-x86_64.dmg.sha256
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified build
        if: needs.build.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_ids }}
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Publish or verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
