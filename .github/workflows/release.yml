name: Release LumaLuma
run-name: "Release LumaLuma #${{ github.run_number }} (${{ inputs.bump }})"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment from the latest stable release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: lumaluma-release
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      base_tag: ${{ steps.plan.outputs.base_tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch the release from the main branch."
          exit 1
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: python3 scripts/release_plan.py --plan-file "$RUNNER_TEMP/release-plan.json"
      - name: Save release plan
        if: steps.plan.outputs.upload_plan == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan.json
          path: ${{ runner.temp }}/release-plan.json
          archive: false
          if-no-files-found: error

  build_arm64:
    name: Build (arm64)
    needs: prepare
    if: needs.prepare.outputs.mode == 'build'
    uses: ./.github/workflows/build-dmg.yml
    with:
      architecture: arm64
      release_version: ${{ needs.prepare.outputs.version }}
      upload_artifacts: true

  build_x86_64:
    name: Build (x86_64)
    needs: prepare
    if: needs.prepare.outputs.mode == 'build'
    uses: ./.github/workflows/build-dmg.yml
    with:
      architecture: x86_64
      release_version: ${{ needs.prepare.outputs.version }}
      upload_artifacts: true

  publish:
    name: Publish or verify release
    needs: [prepare, build_arm64, build_x86_64]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.prepare.outputs.mode == 'verify' ||
           (needs.prepare.outputs.mode == 'build' && needs.build_arm64.result == 'success' &&
            needs.build_x86_64.result == 'success')) }}
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_BASE_TAG: ${{ needs.prepare.outputs.base_tag }}
    steps:
      - name: Check out release publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check whether the release is already published
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py preflight
      - name: Require all four artifact IDs
        id: downloads
        if: steps.preflight.outputs.published != 'true'
        env:
          ARTIFACT_IDS: >-
            ${{ format('{0},{1},{2},{3}',
              needs.build_arm64.outputs.image_artifact_id,
              needs.build_arm64.outputs.checksum_artifact_id,
              needs.build_x86_64.outputs.image_artifact_id,
              needs.build_x86_64.outputs.checksum_artifact_id) }}
        run: |
          if [[ ! "$ARTIFACT_IDS" =~ ^[1-9][0-9]*(,[1-9][0-9]*){3}$ ]]; then
            echo "::error::The release requires an image and checksum from each build."
            exit 1
          fi
          printf 'artifact_ids=%s\n' "$ARTIFACT_IDS" >> "$GITHUB_OUTPUT"
      - name: Download verified build
        if: steps.preflight.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.downloads.outputs.artifact_ids }}
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Publish release
        if: steps.preflight.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
